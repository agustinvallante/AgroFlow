        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TruckInput' }
      responses:
        '201':
          description: Truck created
          headers:
            Location:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MutationReceipt' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /api/v1/trucks/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      operationId: getTruck
      summary: Get a truck
      responses:
        '200':
          description: Truck
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TruckResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
