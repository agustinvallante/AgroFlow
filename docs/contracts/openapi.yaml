openapi: 3.1.0
info:
  title: AgroFlow API
  version: 0.1.0
  description: >-
    Versioned API for authenticated, tenant-scoped master-data operations.
servers:
  - url: http://localhost:5000
    description: Development
security:
  - bearerAuth: []
paths:
  /api/v1/drivers:
    get:
      operationId: listDrivers
      summary: List drivers
      description: Lists drivers in the authenticated ingenio, optionally filtered by activity.
      parameters:
        - $ref: '#/components/parameters/active'
      responses:
        '200':
          description: Driver list
          content:
            application/json:
              schema:
                type: array
