# Vhost for the shared Castel Tech proxy (see docs/operations/vps-deploy.md).
# Everything goes to the dashboard container, which serves the bundle, adds
# the dashboard key and proxies /api to the internal API.
server {
    listen 80;
    server_name zafraflow.casteltech.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name zafraflow.casteltech.ar;

    ssl_certificate     /etc/nginx/certs/casteltech-origin.pem;
    ssl_certificate_key /etc/nginx/certs/casteltech-origin.key;

    resolver 127.0.0.11 valid=10s;
    set $agroflow_web http://agroflow_web:80;

    location / {
        proxy_pass $agroflow_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
