name: Funcionalidad o cambio
description: Proponer trabajo funcional vinculado con OpenSpec.
title: "[Funcionalidad]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de crear la tarea, revisá `openspec/specs/`, las decisiones pendientes y `docs/development/issue-readiness.md`. No marques la tarea como lista para implementación si el contrato o una decisión necesaria siguen abiertos.
  - type: dropdown
    id: area
    attributes:
      label: Área responsable
      options:
        - Backend
        - Frontend
        - Compartida
        - Documentación
    validations:
      required: true
  - type: input
    id: capability
    attributes:
      label: Capacidad OpenSpec
      description: Ruta o nombre de la capacidad afectada.
      placeholder: turnos-ciclo-de-vida
    validations:
      required: true
  - type: input
    id: use_case
    attributes:
      label: Caso de uso y reglas
      description: Identificadores relacionados.
      placeholder: CU-006, RN-026, RN-030A
    validations:
      required: true
  - type: input
    id: change
    attributes:
      label: Cambio OpenSpec
      description: Identificador del cambio; usar "no aplica" solo si restaura una spec vigente.
      placeholder: agregar-transicion-en-espera
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Base y fuentes normativas exactas
      description: Commit o PR base y enlaces a requisitos/escenarios OpenSpec, operación OpenAPI, ADR y decisiones OD aplicables.
      placeholder: |
        Base: main @ <commit>
        OpenSpec: openspec/specs/<capacidad>/spec.md — <Requirement>
        OpenAPI: docs/contracts/openapi.yaml — <operationId>
        ADR/OD: <enlaces o "no aplica">
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Resultado observable
      description: Qué podrá hacer el usuario o qué comportamiento cambiará.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: Escenarios verificables, incluyendo errores y permisos relevantes.
      placeholder: |
        - [ ] Escenario principal
        - [ ] Validaciones y permisos
        - [ ] Contrato y pruebas actualizados
    validations:
      required: true
  - type: textarea
    id: implementation_map
    attributes:
      label: Mapa de implementación y límites
      description: Archivos existentes/nuevos, persistencia o migración, consumidores afectados, compatibilidad y fuera de alcance.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verificación reproducible
      description: Pruebas de éxito, validación, seguridad, conflicto/reintento cuando apliquen y comandos exactos para ejecutar.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencias o bloqueos
      description: Contratos, decisiones OD abiertas u otras tareas necesarias; escribir "ninguno" sólo después de verificarlos.
    validations:
      required: true
