name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  specifications:
    name: Specifications and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate current OpenSpec specifications
        run: npx --yes @fission-ai/openspec@1.13.1 validate --all --strict --no-interactive
      - name: Validate archived OpenSpec changes
        run: npx --yes @fission-ai/openspec@1.13.1 validate --archived --no-interactive
      - name: Validate OpenAPI contract
        run: >-
          npx --yes @redocly/cli@2.53.3 lint docs/contracts/openapi.yaml
          --skip-rule info-license --skip-rule no-server-example.com
      - name: Check local Markdown links
        run: node .github/scripts/check-local-markdown-links.mjs

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/AgroFlow.sln
      - name: Build
        run: dotnet build backend/AgroFlow.sln --configuration Release --no-restore
      - name: Require backend test project
        run: test -f backend/AgroFlow.Tests/AgroFlow.Tests.csproj
      - name: Run backend tests
        run: >-
          dotnet test backend/AgroFlow.sln --configuration Release --no-build --no-restore
          --logger 'trx;LogFileName=backend-tests.trx'
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Publish backend delivery artifact
        if: github.event_name == 'push'
        run: >-
          dotnet publish backend/AgroFlow.Api/AgroFlow.Api.csproj --configuration Release
          --no-build --no-restore --output ${{ runner.temp }}/backend-publish
      - name: Upload backend delivery artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: agroflow-backend-${{ github.sha }}
          path: ${{ runner.temp }}/backend-publish
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Reject high or critical npm advisories, including transitive dev dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Test frontend
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Upload frontend delivery artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: agroflow-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  integrations:
    name: Repository automation and integrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test integration validation rules
        run: node --test .github/scripts/tests/integrations.test.mjs
      - name: Validate portable workflow and example configuration
        env:
          INTEGRATION_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/validate-integrations.mjs
      - name: Validate Compose without starting containers or reading private environment
        shell: bash
        run: |
          if [[ -f infra/compose.yaml ]]; then
            docker compose --env-file infra/env.example -f infra/compose.yaml config --quiet
          fi

  required:
    name: Required checks
    if: always()
    needs: [specifications, backend, frontend, integrations]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify every required job
        env:
          SPECIFICATIONS_RESULT: ${{ needs.specifications.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          INTEGRATIONS_RESULT: ${{ needs.integrations.result }}
        shell: bash
        run: |
          if [[ $SPECIFICATIONS_RESULT != success || $BACKEND_RESULT != success ||
                $FRONTEND_RESULT != success || $INTEGRATIONS_RESULT != success ]]; then
            echo '::error::Every required job must succeed, including integration validation.'
            exit 1
          fi
