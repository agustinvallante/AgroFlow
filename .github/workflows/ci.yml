name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  specifications:
    name: Specifications and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate current OpenSpec specifications
        run: npx --yes @fission-ai/openspec@1.13.1 validate --all --strict --no-interactive

      - name: Validate archived OpenSpec changes
        run: npx --yes @fission-ai/openspec@1.13.1 validate --archived --no-interactive

      - name: Validate OpenAPI contract
        run: >-
          npx --yes @redocly/cli@2.53.3 lint docs/contracts/openapi.yaml
          --skip-rule info-license
          --skip-rule no-server-example.com

      - name: Check local Markdown links
        run: node .github/scripts/check-local-markdown-links.mjs

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore backend/Dsw2025Tpi.sln

      - name: Build
        run: dotnet build backend/Dsw2025Tpi.sln --configuration Release --no-restore

      - name: Detect backend test projects
        id: backend-tests
        shell: bash
        run: |
          if find backend -type f \( -name '*Test.csproj' -o -name '*Tests.csproj' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El backend compila, pero todavía no existen proyectos de pruebas automatizadas."
          fi

      - name: Run backend tests
        if: steps.backend-tests.outputs.found == 'true'
        run: >-
          dotnet test backend/Dsw2025Tpi.sln
          --configuration Release
          --no-build
          --no-restore
          --logger "trx;LogFileName=backend-tests.trx"

      - name: Upload backend test results
        if: always() && steps.backend-tests.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

      - name: Publish backend delivery artifact
        if: github.event_name == 'push'
        run: >-
          dotnet publish backend/Dsw2025Tpi.Api/Dsw2025Tpi.Api.csproj
          --configuration Release
          --no-build
          --no-restore
          --output "${{ runner.temp }}/backend-publish"

      - name: Upload backend delivery artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: agroflow-backend-${{ github.sha }}
          path: ${{ runner.temp }}/backend-publish
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect frontend project
        id: frontend-project
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            if [[ ! -f frontend/package-lock.json ]]; then
              echo "::error::El frontend tiene package.json pero no package-lock.json; CI requiere instalaciones reproducibles."
              exit 1
            fi
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            unexpected_file="$(find frontend -type f ! -name README.md -print -quit)"
            if [[ -n "$unexpected_file" ]]; then
              echo "::error::Hay código en frontend/ pero falta package.json."
              exit 1
            fi
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::El frontend todavía no fue importado; el job se activará al agregar package.json y package-lock.json."
          fi

      - name: Set up Node.js
        if: steps.frontend-project.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend-project.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        if: steps.frontend-project.outputs.present == 'true'
        working-directory: frontend
        run: npm run typecheck --if-present

      - name: Lint frontend
        if: steps.frontend-project.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present

      - name: Test frontend
        if: steps.frontend-project.outputs.present == 'true'
        working-directory: frontend
        env:
          CI: "true"
        run: npm test --if-present

      - name: Build frontend
        if: steps.frontend-project.outputs.present == 'true'
        working-directory: frontend
        run: npm run build

      - name: Upload frontend delivery artifact
        if: github.event_name == 'push' && steps.frontend-project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agroflow-frontend-${{ github.sha }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 14

  required:
    name: Required checks
    if: always()
    needs: [specifications, backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          SPECIFICATIONS_RESULT: ${{ needs.specifications.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        shell: bash
        run: |
          for result in "$SPECIFICATIONS_RESULT" "$BACKEND_RESULT" "$FRONTEND_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "::error::Al menos una verificación obligatoria no terminó correctamente."
              exit 1
            fi
          done
