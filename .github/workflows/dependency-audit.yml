name: Scheduled frontend security audit

on:
  schedule:
    # Monday 09:00 Argentina; no updates or automatic merges.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit current frontend lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Fail on high or critical advisories without installing or changing packages
        working-directory: frontend
        run: npm audit --package-lock-only --audit-level=high
